# Builds and runs the NTA collector on your PC, for testing a change before you release it
# (README.md, section 3). The server runs the published image instead (section 5).
services:
  collector:
    build: .
    image: nta-collector
    container_name: nta-collector   # one collector per pair of keys; a second copy won't start
    restart: unless-stopped         # back up after a crash or a reboot, unless you stopped it
    init: true                      # passes `docker stop` on to the collector, so it stops cleanly
    stop_grace_period: 60s          # time to finish the round in progress (up to about 40s)
    user: "1000:1000"               # who owns the files written to data/
    env_file: collector.env         # API keys and the healthchecks.io ping URL
    volumes:
      - ./data:/data
    logging:
      driver: json-file
      options:
        max-size: "10m"             # keep the log from growing forever
        max-file: "3"
