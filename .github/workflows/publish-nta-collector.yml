# Publishes the NTA collector's Docker image to GitHub's container registry as
# ghcr.io/<owner>/nta-collector:<version> (and :latest), for x86 and ARM servers,
# whenever a release tag like nta-collector-v0.1.1 is created. NTA-Collector/README.md,
# section 4, has the release steps.
name: Publish NTA collector image

on:
  push:
    tags: ["nta-collector-v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read    # to check out the code
  packages: write   # to push the image to ghcr.io

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Work out the image name and version
        id: release
        run: |
          # Registry names must be lower case. The version is the tag without its prefix.
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/nta-collector" >> "$GITHUB_OUTPUT"
          echo "version=${GITHUB_REF_NAME#nta-collector-v}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v4    # lets the x86 runner build the ARM image too
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: NTA-Collector
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ steps.release.outputs.version }}
          # The source label links the package to this repo, and tells Renovate where the release notes are.
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.release.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          tags: |
            ${{ steps.release.outputs.image }}:${{ steps.release.outputs.version }}
            ${{ steps.release.outputs.image }}:latest
          push: true
